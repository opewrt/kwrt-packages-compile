name: Packages-AutoBuild

on:
  repository_dispatch:
    types:
      - kwrt-sdk-released
      - packages-build
  workflow_dispatch:
    inputs:
      target:
        description: 'package architecture'
        required: true
        default: 'x86_64'
      sdk_repository:
        description: 'Kwrt SDK release repository'
        required: false
        default: 'opewrt/Kwrt'
      sdk_tag:
        description: 'Kwrt release tag, empty selects the latest compatible release'
        required: false
        default: ''
      sdk_asset:
        description: 'exact SDK asset name, empty selects the release SDK'
        required: false
        default: ''
      main_commit:
        description: 'exact kwrt-main commit, empty uses main'
        required: false
        default: ''
      packages_commit:
        description: 'exact kwrt-packages commit, empty uses SDK MANIFEST.refs'
        required: false
        default: ''
      resume_build_identity:
        description: 'previous build identity for a queue-compatible checkpoint migration'
        required: false
        default: ''
      resume_checkpoint_run_id:
        description: 'previous workflow run ID containing a full queue checkpoint artifact'
        required: false
        default: ''
      packages:
        description: 'managed package directory regex'
        required: false
        default: '.*'
      release:
        description: 'create package release'
        required: false
        type: boolean
        default: true
      nocache:
        description: 'disable SDK, download, compiler and checkpoint caches'
        required: false
        type: boolean
        default: false
env:
  TZ: Asia/Shanghai
  CCACHE_DIR: /mnt/openwrt/ccache

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    if: github.repository_owner == 'opewrt'
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.inputs.outputs.target }}
      packages: ${{ steps.inputs.outputs.packages }}
      sdk_repository: ${{ steps.inputs.outputs.sdk_repository }}
      sdk_tag: ${{ steps.inputs.outputs.sdk_tag }}
      sdk_asset: ${{ steps.inputs.outputs.sdk_asset }}
      main_commit: ${{ steps.inputs.outputs.main_commit }}
      packages_commit: ${{ steps.inputs.outputs.packages_commit }}
      resume_build_identity: ${{ steps.inputs.outputs.resume_build_identity }}
      resume_checkpoint_run_id: ${{ steps.inputs.outputs.resume_checkpoint_run_id }}
      release: ${{ steps.inputs.outputs.release }}
      nocache: ${{ steps.inputs.outputs.nocache }}
      upload_artifact: ${{ steps.settings.outputs.upload_artifact }}
      upload_release: ${{ steps.settings.outputs.upload_release }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4.3.0

    - name: Normalize build inputs
      id: inputs
      env:
        EVENT_NAME: ${{ github.event_name }}
        EVENT_TARGET: ${{ github.event.client_payload.target || inputs.target }}
        EVENT_PACKAGES: ${{ github.event.client_payload.packages || inputs.packages }}
        EVENT_SDK_REPOSITORY: ${{ github.event.client_payload.sdk_repository || inputs.sdk_repository }}
        EVENT_SDK_TAG: ${{ github.event.client_payload.sdk_tag || inputs.sdk_tag }}
        EVENT_SDK_ASSET: ${{ github.event.client_payload.sdk_asset || inputs.sdk_asset }}
        EVENT_MAIN_COMMIT: ${{ github.event.client_payload.main_commit || inputs.main_commit }}
        EVENT_PACKAGES_COMMIT: ${{ github.event.client_payload.packages_commit || inputs.packages_commit }}
        EVENT_RESUME_BUILD_IDENTITY: ${{ github.event.client_payload.resume_build_identity || inputs.resume_build_identity }}
        EVENT_RESUME_CHECKPOINT_RUN_ID: ${{ github.event.client_payload.resume_checkpoint_run_id || inputs.resume_checkpoint_run_id }}
        DISPATCH_RELEASE: ${{ toJSON(github.event.client_payload.release) }}
        DISPATCH_NOCACHE: ${{ toJSON(github.event.client_payload.nocache) }}
        INPUT_RELEASE: ${{ toJSON(inputs.release) }}
        INPUT_NOCACHE: ${{ toJSON(inputs.nocache) }}
      run: |
        set -euo pipefail
        target="${EVENT_TARGET:-x86_64}"
        packages="${EVENT_PACKAGES:-.*}"
        sdk_repository="${EVENT_SDK_REPOSITORY:-opewrt/Kwrt}"
        packages_commit="${EVENT_PACKAGES_COMMIT:-}"
        resume_build_identity="${EVENT_RESUME_BUILD_IDENTITY:-}"
        resume_checkpoint_run_id="${EVENT_RESUME_CHECKPOINT_RUN_ID:-}"
        if [ -n "$packages_commit" ] && ! [[ "$packages_commit" =~ ^[0-9a-f]{40}$ ]]; then
          echo "packages_commit must be an exact 40-character lowercase commit" >&2
          exit 1
        fi
        if [ -n "$resume_build_identity" ] && ! [[ "$resume_build_identity" =~ ^[0-9a-f]{64}$ ]]; then
          echo "resume_build_identity must be an exact 64-character lowercase SHA256" >&2
          exit 1
        fi
        if [ -n "$resume_checkpoint_run_id" ] && ! [[ "$resume_checkpoint_run_id" =~ ^[0-9]+$ ]]; then
          echo "resume_checkpoint_run_id must be a numeric workflow run ID" >&2
          exit 1
        fi
        case "$EVENT_NAME" in
          repository_dispatch)
            release="${DISPATCH_RELEASE:-null}"
            nocache="${DISPATCH_NOCACHE:-null}"
            ;;
          workflow_dispatch)
            release="${INPUT_RELEASE:-null}"
            nocache="${INPUT_NOCACHE:-null}"
            ;;
          *)
            release="true"
            nocache="false"
            ;;
        esac
        [ "$release" != "null" ] || release="true"
        [ "$nocache" != "null" ] || nocache="false"
        case "$release:$nocache" in
          true:true|true:false|false:true|false:false) ;;
          *) echo "release and nocache must be boolean values" >&2; exit 1 ;;
        esac
        if [ "$packages" != ".*" ] && [ "$release" = "true" ]; then
          echo "Filtered builds do not replace the full SDK-bound package release."
          release="false"
        fi
        {
          echo "target=$target"
          echo "packages=$packages"
          echo "sdk_repository=$sdk_repository"
          echo "sdk_tag=${EVENT_SDK_TAG:-}"
          echo "sdk_asset=${EVENT_SDK_ASSET:-}"
          echo "main_commit=${EVENT_MAIN_COMMIT:-}"
          echo "packages_commit=$packages_commit"
          echo "resume_build_identity=$resume_build_identity"
          echo "resume_checkpoint_run_id=$resume_checkpoint_run_id"
          echo "release=$release"
          echo "nocache=$nocache"
        } >> "$GITHUB_OUTPUT"

    - name: Load package build settings
      id: settings
      run: |
        set -e
        source "$GITHUB_WORKSPACE/devices/common/settings.ini"
        {
          echo "upload_artifact=$UPLOAD_PACKAGES_FOR_ARTIFACT"
          echo "upload_release=$UPLOAD_PACKAGES_FOR_RELEASE"
        } >> "$GITHUB_OUTPUT"

  plan:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    name: Plan sequential package build
    outputs:
      stage_count: ${{ steps.plan.outputs.stage_count }}
      build_identity: ${{ steps.plan.outputs.build_identity }}
      sdk_tag: ${{ steps.sdk.outputs.release_tag }}
      sdk_sha256: ${{ steps.sdk.outputs.sdk_sha256 }}
    env:
      TARGET: ${{ needs.prepare.outputs.target }}
      PACKAGE_FILTER: ${{ needs.prepare.outputs.packages }}
      SDK_REPOSITORY: ${{ needs.prepare.outputs.sdk_repository }}
      REQUESTED_SDK_TAG: ${{ needs.prepare.outputs.sdk_tag }}
      REQUESTED_SDK_ASSET: ${{ needs.prepare.outputs.sdk_asset }}
      REQUESTED_MAIN_COMMIT: ${{ needs.prepare.outputs.main_commit }}
      PACKAGES_COMMIT: ${{ needs.prepare.outputs.packages_commit }}
      NOCACHE: ${{ needs.prepare.outputs.nocache }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4.3.0
      with:
        fetch-depth: 0

    - name: Check private feeds token
      id: private-feeds
      env:
        REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
      run: |
        if [ -n "$REPO_TOKEN" ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        else
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "REPO_TOKEN is not configured; skipping private LuCI feeds."
        fi

    - name: Checkout private feeds workspace
      if: steps.private-feeds.outputs.enabled == 'true'
      uses: actions/checkout@v4.3.0
      with:
        repository: opewrt/kwrt-main
        ref: ${{ needs.prepare.outputs.main_commit || 'main' }}
        token: ${{ secrets.REPO_TOKEN }}
        path: private-workspace
        fetch-depth: 1
        persist-credentials: false

    - name: Checkout private feed submodules
      if: steps.private-feeds.outputs.enabled == 'true'
      env:
        GH_TOKEN: ${{ secrets.REPO_TOKEN }}
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE/private-workspace"
        git config -f .gitmodules --get-regexp '^submodule\..*\.path$' |
        while read -r key submodule_path; do
          case "$submodule_path" in
            luci-apps/*) ;;
            *) continue ;;
          esac
          repo_url="$(git config -f .gitmodules --get "${key%.path}.url")"
          commit="$(git ls-tree HEAD "$submodule_path" | awk '{print $3}')"
          repo="${repo_url#https://github.com/}"
          repo="${repo%.git}"
          rmdir "$submodule_path" 2>/dev/null || true
          gh repo clone "$repo" "$submodule_path" -- --no-checkout
          git -C "$submodule_path" checkout --detach "$commit"
        done

    - name: Record private workspace commit
      run: |
        if [ -d "$GITHUB_WORKSPACE/private-workspace/.git" ]; then
          main_commit="$(git -C "$GITHUB_WORKSPACE/private-workspace" rev-parse HEAD)"
        else
          main_commit="none"
        fi
        echo "PRIVATE_WORKSPACE_COMMIT=$main_commit" >> "$GITHUB_ENV"

    - name: Free disk space
      uses: coder-xiaomo/free-disk-space@1.4.0
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Initialize environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang libncurses-dev zlib1g-dev gawk git \
          gettext libssl-dev xsltproc rsync wget unzip curl zstd ccache \
          llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils rename \
          libelf-dev libgmp3-dev libmpc-dev libfuse-dev bc
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

    - name: Resolve Kwrt SDK release
      id: sdk
      run: |
        "$GITHUB_WORKSPACE/devices/common/resolve-kwrt-sdk.sh" \
          "$SDK_REPOSITORY" \
          "$TARGET" \
          "$REQUESTED_SDK_TAG" \
          "$REQUESTED_SDK_ASSET" \
          "$GITHUB_WORKSPACE/sdk-metadata"

    - name: Prepare cache directories
      run: |
        sudo mkdir -p -m 777 /mnt/openwrt/dl /mnt/openwrt/ccache
        mkdir -p "$GITHUB_WORKSPACE/.cache/sdk"

    - name: Cache Kwrt SDK
      uses: actions/cache@v4
      if: env.NOCACHE != 'true'
      with:
        path: .cache/sdk
        key: kwrt-sdk-${{ runner.os }}-${{ steps.sdk.outputs.release_tag }}-${{ steps.sdk.outputs.sdk_sha256 }}

    - name: Restore package downloads
      uses: actions/cache/restore@v4
      if: env.NOCACHE != 'true'
      with:
        path: /mnt/openwrt/dl
        key: kwrt-packages-dl-${{ runner.os }}-${{ env.TARGET }}-${{ steps.sdk.outputs.release_tag }}-plan-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          kwrt-packages-dl-${{ runner.os }}-${{ env.TARGET }}-${{ steps.sdk.outputs.release_tag }}-
          kwrt-packages-dl-${{ runner.os }}-${{ env.TARGET }}-

    - name: Download and verify Kwrt SDK
      run: |
        set -euo pipefail
        sdk_dir="$GITHUB_WORKSPACE/.cache/sdk/$SDK_RELEASE_TAG"
        sdk_archive="$sdk_dir/$SDK_ASSET_NAME"
        mkdir -p "$sdk_dir"
        if [ ! -f "$sdk_archive" ]; then
          curl -fL --retry 5 --retry-delay 5 "$SDK_DOWNLOAD_URL" -o "$sdk_archive"
        fi
        printf '%s  %s\n' "$SDK_SHA256" "$SDK_ASSET_NAME" |
          (cd "$sdk_dir" && sha256sum -c -)
        echo "SDK_ARCHIVE=$sdk_archive" >> "$GITHUB_ENV"

    - name: Extract and configure final SDK tree
      env:
        PRIVATE_FEEDS_ROOT: ${{ steps.private-feeds.outputs.enabled == 'true' && format('{0}/private-workspace/luci-apps', github.workspace) || '' }}
        KIDDIN9_REF: ${{ env.PACKAGES_COMMIT }}
      run: |
        "$GITHUB_WORKSPACE/devices/common/prepare-kwrt-sdk.sh" \
          "$SDK_ARCHIVE" "$TARGET" "$GITHUB_WORKSPACE/sdk-metadata/MANIFEST.refs" \
          "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/openwrt"

    - name: Audit managed feed sources
      run: |
        cd "$GITHUB_WORKSPACE/openwrt"
        python3 devices/common/source-policy-audit.py \
          --root . \
          --managed-feeds .managed-feeds \
          --private-feeds .private-feeds \
          --output . \
          --mode report

    - name: Generate source and host build plan
      id: plan
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE/openwrt"
        mkdir -p build-plan
        printdb_status=0
        make OPENWRT_BUILD=1 -rR -qp world DUMP_TARGET_DB=1 \
          > tmp/.make-printdb 2> build-plan/make-printdb.stderr || printdb_status=$?
        if [ "$printdb_status" -gt 1 ]; then
          echo "make dependency database failed with status $printdb_status" >&2
          cat build-plan/make-printdb.stderr >&2
          tail -n 200 tmp/.make-printdb >&2
          exit "$printdb_status"
        fi
        python3 devices/common/plan-package-build.py \
          --packageinfo tmp/.packageinfo \
          --printdb tmp/.make-printdb \
          --managed-feeds .managed-feeds \
          --package-filter "$PACKAGE_FILTER" \
          --output build-plan
        stage_count="$(jq -r .stage_count build-plan/plan.json)"
        build_identity="$({
          printf 'compiler-commit=%s\n' "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          printf 'private-workspace=%s\n' "$PRIVATE_WORKSPACE_COMMIT"
          sha256sum .config .managed-feeds feeds.conf SOURCE-MANIFEST.tsv build-plan/queue.tsv
          find "$GITHUB_WORKSPACE/sdk-metadata" -type f -print0 | sort -z | xargs -0 sha256sum
        } | sha256sum | cut -d ' ' -f 1)"
        printf '%s\n' "$build_identity" > build-plan/build-identity
        {
          echo "stage_count=$stage_count"
          echo "build_identity=$build_identity"
        } >> "$GITHUB_OUTPUT"

    - name: Package prepared SDK and plan
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/package-plan"
        tar --zstd -cf "$GITHUB_WORKSPACE/package-plan/prepared-sdk.tar.zst" \
          --exclude='./dl' --exclude='./.ccache' -C "$GITHUB_WORKSPACE/openwrt" .
        cp -a "$GITHUB_WORKSPACE/openwrt/build-plan" "$GITHUB_WORKSPACE/package-plan/"
        cp -f "$GITHUB_WORKSPACE/openwrt"/SOURCE-AUDIT.tsv \
          "$GITHUB_WORKSPACE/openwrt"/SOURCE-AUDIT.json \
          "$GITHUB_WORKSPACE/openwrt"/SOURCE-AUDIT-SUMMARY.txt \
          "$GITHUB_WORKSPACE/openwrt"/SOURCE-MANIFEST.tsv \
          "$GITHUB_WORKSPACE/package-plan/"
        cp -a "$GITHUB_WORKSPACE/sdk-metadata" "$GITHUB_WORKSPACE/package-plan/"
        printf '%s\n' "$PRIVATE_WORKSPACE_COMMIT" > "$GITHUB_WORKSPACE/package-plan/private-workspace-commit"
        if [ -d "$GITHUB_WORKSPACE/private-workspace/luci-apps" ]; then
          tar --zstd --exclude-vcs -cf "$GITHUB_WORKSPACE/package-plan/private-feeds.tar.zst" \
            -C "$GITHUB_WORKSPACE/private-workspace" luci-apps
        fi

    - name: Upload package build plan
      uses: actions/upload-artifact@v4.6.2
      with:
        name: package-build-plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: package-plan
        if-no-files-found: error
        compression-level: 0

  sequential-build:
    needs: [prepare, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 355
    name: Build dependency queue
    env:
      TARGET: ${{ needs.prepare.outputs.target }}
      NOCACHE: ${{ needs.prepare.outputs.nocache }}
      SDK_TAG: ${{ needs.plan.outputs.sdk_tag }}
      SDK_SHA256: ${{ needs.plan.outputs.sdk_sha256 }}
      BUILD_IDENTITY: ${{ needs.plan.outputs.build_identity }}
      RESUME_BUILD_IDENTITY: ${{ needs.prepare.outputs.resume_build_identity || needs.plan.outputs.build_identity }}
      CHECKPOINT_RUN_ID: ${{ needs.prepare.outputs.resume_checkpoint_run_id }}
      STAGE_NAME: sequential

    steps:
    - name: Checkout
      uses: actions/checkout@v4.3.0

    - name: Record queue deadline origin
      run: echo "QUEUE_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

    - name: Free disk space
      uses: coder-xiaomo/free-disk-space@1.4.0
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Initialize environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang libncurses-dev zlib1g-dev gawk git \
          gettext libssl-dev xsltproc rsync wget unzip curl zstd ccache \
          llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils rename \
          libelf-dev libgmp3-dev libmpc-dev libfuse-dev bc
        sudo -E apt-get -qq clean
        sudo mkdir -p -m 777 /mnt/openwrt/dl /mnt/openwrt/ccache

    - name: Download package build plan
      uses: actions/download-artifact@v4.3.0
      with:
        name: package-build-plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: package-plan

    - name: Restore package downloads
      uses: actions/cache/restore@v4
      if: env.NOCACHE != 'true'
      with:
        path: /mnt/openwrt/dl
        key: kwrt-packages-dl-${{ runner.os }}-${{ env.TARGET }}-${{ env.SDK_TAG }}-${{ env.BUILD_IDENTITY }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          kwrt-packages-dl-${{ runner.os }}-${{ env.TARGET }}-${{ env.SDK_TAG }}-${{ env.BUILD_IDENTITY }}-
          kwrt-packages-dl-${{ runner.os }}-${{ env.TARGET }}-${{ env.SDK_TAG }}-
          kwrt-packages-dl-${{ runner.os }}-${{ env.TARGET }}-

    - name: Restore compiler cache
      uses: actions/cache/restore@v4
      if: env.NOCACHE != 'true'
      with:
        path: /mnt/openwrt/ccache
        key: kwrt-packages-ccache-${{ runner.os }}-${{ env.TARGET }}-${{ env.SDK_TAG }}-${{ env.BUILD_IDENTITY }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          kwrt-packages-ccache-${{ runner.os }}-${{ env.TARGET }}-${{ env.SDK_TAG }}-${{ env.BUILD_IDENTITY }}-
          kwrt-packages-ccache-${{ runner.os }}-${{ env.TARGET }}-${{ env.SDK_TAG }}-

    - name: Restore prepared SDK
      run: |
        set -euo pipefail
        mkdir -p openwrt
        tar --zstd -xf package-plan/prepared-sdk.tar.zst -C openwrt
        rm -rf openwrt/build-state
        if [ -f package-plan/private-feeds.tar.zst ]; then
          mkdir -p "$GITHUB_WORKSPACE/private-workspace"
          tar --zstd -xf package-plan/private-feeds.tar.zst -C "$GITHUB_WORKSPACE/private-workspace"
        fi
        test "$(<package-plan/build-plan/build-identity)" = "$BUILD_IDENTITY"
        cmp -s package-plan/SOURCE-MANIFEST.tsv openwrt/SOURCE-MANIFEST.tsv
        ln -s /mnt/openwrt/dl openwrt/dl
        ln -s /mnt/openwrt/ccache openwrt/.ccache

    - name: Restore queue checkpoint artifact
      if: env.CHECKPOINT_RUN_ID != ''
      uses: actions/download-artifact@v4.3.0
      with:
        name: package-checkpoint
        path: openwrt
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        run-id: ${{ env.CHECKPOINT_RUN_ID }}

    - name: Restore queue checkpoint
      id: checkpoint
      uses: actions/cache/restore@v4
      if: env.NOCACHE != 'true' && env.CHECKPOINT_RUN_ID == ''
      with:
        path: |
          openwrt/staging_dir
          openwrt/bin
          openwrt/build-state
          openwrt/build_dir/target-*/linux-*/symvers
        key: kwrt-packages-state-${{ runner.os }}-${{ env.TARGET }}-${{ env.SDK_TAG }}-${{ env.BUILD_IDENTITY }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          kwrt-packages-state-${{ runner.os }}-${{ env.TARGET }}-${{ env.SDK_TAG }}-${{ env.BUILD_IDENTITY }}-

    - name: Restore legacy queue checkpoint
      uses: actions/cache/restore@v4
      if: env.NOCACHE != 'true' && env.CHECKPOINT_RUN_ID == '' && steps.checkpoint.outputs.cache-matched-key == '' && env.RESUME_BUILD_IDENTITY != env.BUILD_IDENTITY
      with:
        path: |
          openwrt/staging_dir
          openwrt/bin
          openwrt/build-state
        key: kwrt-packages-state-${{ runner.os }}-${{ env.TARGET }}-${{ env.SDK_TAG }}-${{ env.BUILD_IDENTITY }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          kwrt-packages-state-${{ runner.os }}-${{ env.TARGET }}-${{ env.SDK_TAG }}-${{ env.RESUME_BUILD_IDENTITY }}-

    - name: Compile dependency queue
      id: compile
      continue-on-error: true
      run: |
        set -uo pipefail
        status=0
        cd openwrt
        BUILD_PLAN_DIR="$GITHUB_WORKSPACE/package-plan/build-plan" \
          BUILD_STATE_DIR="$GITHUB_WORKSPACE/openwrt/build-state" \
          /bin/bash devices/common/compile-package-queue.sh \
          "$GITHUB_WORKSPACE/package-plan/build-plan/queue.tsv" || status=$?
        queue_status="$(sed -n 's/^status=//p' build-state/QUEUE-STATE.txt 2>/dev/null || true)"
        [ -n "$queue_status" ] || queue_status="failed"
        {
          echo "exit_code=$status"
          echo "queue_status=$queue_status"
        } >> "$GITHUB_OUTPUT"
        exit "$status"

    - name: Quiesce checkpoint files
      if: always() && steps.compile.outcome != 'skipped'
      run: |
        set -euo pipefail
        CCACHE_DIR=/mnt/openwrt/ccache ccache --cleanup || true
        sync
        test -f openwrt/build-state/QUEUE-STATE.txt
        cat openwrt/build-state/QUEUE-STATE.txt

    - name: Save compiler cache
      uses: actions/cache/save@v4
      if: always() && steps.compile.outcome != 'skipped' && env.NOCACHE != 'true'
      with:
        path: /mnt/openwrt/ccache
        key: kwrt-packages-ccache-${{ runner.os }}-${{ env.TARGET }}-${{ env.SDK_TAG }}-${{ env.BUILD_IDENTITY }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Save package download cache
      uses: actions/cache/save@v4
      if: always() && steps.compile.outcome != 'skipped' && env.NOCACHE != 'true'
      with:
        path: /mnt/openwrt/dl
        key: kwrt-packages-dl-${{ runner.os }}-${{ env.TARGET }}-${{ env.SDK_TAG }}-${{ env.BUILD_IDENTITY }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Save queue checkpoint
      uses: actions/cache/save@v4
      if: always() && steps.compile.outcome != 'skipped' && env.NOCACHE != 'true'
      with:
        path: |
          openwrt/staging_dir
          openwrt/bin
          openwrt/build-state
          openwrt/build_dir/target-*/linux-*/symvers
        key: kwrt-packages-state-${{ runner.os }}-${{ env.TARGET }}-${{ env.SDK_TAG }}-${{ env.BUILD_IDENTITY }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Upload queue checkpoint artifact
      uses: actions/upload-artifact@v4.6.2
      if: always() && steps.compile.outcome != 'skipped'
      with:
        name: package-checkpoint
        path: |
          openwrt/staging_dir
          openwrt/bin
          openwrt/build-state
          openwrt/build_dir/target-*/linux-*/symvers
        if-no-files-found: error
        compression-level: 0
        retention-days: 2

    - name: Prepare cumulative result
      if: always() && steps.compile.outcome != 'skipped'
      run: |
        set -euo pipefail
        artifact="$GITHUB_WORKSPACE/package-stage"
        mkdir -p "$artifact/ipk" "$artifact/metadata/sdk-metadata"
        rsync -a --prune-empty-dirs --include='*/' --include='*.ipk' --exclude='*' openwrt/bin/ "$artifact/ipk/bin/"
        cp -a openwrt/build-state/build-results "$artifact/"
        if [ -d openwrt/build-state/build-logs ]; then cp -a openwrt/build-state/build-logs "$artifact/"; fi
        cp -f openwrt/.config "$artifact/metadata/openwrt.config"
        cp -f openwrt/.managed-feeds "$artifact/metadata/managed-feeds"
        cp -f openwrt/feeds.conf "$artifact/metadata/feeds.conf"
        cp -f package-plan/build-plan/build-identity "$artifact/metadata/build-identity"
        cp -f package-plan/SOURCE-AUDIT.tsv \
          package-plan/SOURCE-AUDIT.json \
          package-plan/SOURCE-AUDIT-SUMMARY.txt \
          package-plan/SOURCE-MANIFEST.tsv \
          "$artifact/metadata/"
        cp -f package-plan/private-workspace-commit "$artifact/metadata/private-workspace-commit"
        cp -a package-plan/sdk-metadata/. "$artifact/metadata/sdk-metadata/"
        compile_outcome=failure
        if [ "${{ steps.compile.outcome }}" = success ] && [ "${{ steps.compile.outputs.queue_status }}" = complete ]; then
          compile_outcome=success
        fi
        {
          echo "stage_name=$STAGE_NAME"
          echo "compile_outcome=$compile_outcome"
        } > "$artifact/STAGE.txt"

    - name: Upload cumulative result and logs
      uses: actions/upload-artifact@v4.6.2
      if: always() && steps.compile.outcome != 'skipped'
      with:
        name: package-stage-sequential
        path: package-stage
        if-no-files-found: error
        compression-level: 0

    - name: Fail paused or incomplete queue
      if: steps.compile.outcome != 'success' || steps.compile.outputs.queue_status != 'complete'
      run: |
        echo "Package queue status: ${{ steps.compile.outputs.queue_status }}"
        echo "The checkpoint was saved; start the workflow manually to continue."
        exit 1

  merge-release:
    needs: [prepare, plan, sequential-build]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.plan.result == 'success' &&
      needs.sequential-build.result == 'success' &&
      github.repository_owner == 'opewrt'
    runs-on: ubuntu-latest
    name: Merge packages and release
    env:
      TARGET: ${{ needs.prepare.outputs.target }}
      PACKAGE_FILTER: ${{ needs.prepare.outputs.packages }}
      SDK_REPOSITORY: ${{ needs.prepare.outputs.sdk_repository }}
      CREATE_RELEASE: ${{ needs.prepare.outputs.release }}
      UPLOAD_PACKAGES_FOR_ARTIFACT: ${{ needs.prepare.outputs.upload_artifact }}
      UPLOAD_PACKAGES_FOR_RELEASE: ${{ needs.prepare.outputs.upload_release }}
      STAGE_COUNT: ${{ needs.plan.outputs.stage_count }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4.3.0
      with:
        fetch-depth: 0

    - name: Download package build plan
      uses: actions/download-artifact@v4.3.0
      with:
        name: package-build-plan-${{ github.run_id }}-${{ github.run_attempt }}
        path: package-plan

    - name: Download package stage artifacts
      uses: actions/download-artifact@v4.3.0
      with:
        pattern: package-stage-*
        path: package-stages

    - name: Read build selection
      id: selection
      run: |
        set -euo pipefail
        source package-plan/sdk-metadata/SDK.refs
        main_commit="$(<package-plan/private-workspace-commit)"
        test -n "$sdk_release_tag"
        test -n "$sdk_asset"
        test -n "$main_commit"
        {
          echo "SDK_RELEASE_TAG=$sdk_release_tag"
          echo "SDK_ASSET_NAME=$sdk_asset"
          echo "SDK_SHA256=$sdk_sha256"
          echo "main_commit=$main_commit"
        } >> "$GITHUB_ENV"
        echo "main_commit=$main_commit" >> "$GITHUB_OUTPUT"

    - name: Check private feeds token
      id: private-feeds
      env:
        REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
      run: |
        if [ -n "$REPO_TOKEN" ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        else
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "REPO_TOKEN is not configured; package Release will be skipped."
        fi

    - name: Checkout private feeds workspace metadata
      if: steps.private-feeds.outputs.enabled == 'true' && steps.selection.outputs.main_commit != 'none'
      uses: actions/checkout@v4.3.0
      with:
        repository: opewrt/kwrt-main
        ref: ${{ steps.selection.outputs.main_commit }}
        token: ${{ secrets.REPO_TOKEN }}
        path: private-workspace
        fetch-depth: 1
        persist-credentials: false

    - name: Record private workspace commit
      run: |
        if [ -d "$GITHUB_WORKSPACE/private-workspace/.git" ]; then
          main_commit="$(git -C "$GITHUB_WORKSPACE/private-workspace" rev-parse HEAD)"
        else
          main_commit="none"
        fi
        echo "PRIVATE_WORKSPACE_COMMIT=$main_commit" >> "$GITHUB_ENV"

    - name: Initialize merge environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install jq zstd
        sudo -E apt-get -qq clean

    - name: Restore prepared SDK
      run: |
        set -euo pipefail
        mkdir -p openwrt
        tar --zstd -xf package-plan/prepared-sdk.tar.zst -C openwrt
        if [ -f package-plan/private-feeds.tar.zst ]; then
          mkdir -p "$GITHUB_WORKSPACE/private-workspace"
          tar --zstd -xf package-plan/private-feeds.tar.zst -C "$GITHUB_WORKSPACE/private-workspace"
        fi
        find openwrt/bin -type f -name '*.ipk' -delete 2>/dev/null || true

    - name: Merge and verify package stages
      run: |
        /bin/bash "$GITHUB_WORKSPACE/devices/common/merge-package-shards.sh" \
          "$GITHUB_WORKSPACE/package-stages" \
          "$GITHUB_WORKSPACE/openwrt" \
          "$GITHUB_WORKSPACE/sdk-metadata"

    - name: Generate package indexes
      run: |
        cd openwrt
        make package/index

    - name: Prepare package release
      run: |
        "$GITHUB_WORKSPACE/devices/common/prepare-package-release.sh" \
          "$GITHUB_WORKSPACE/openwrt" \
          "$GITHUB_WORKSPACE/package-release" \
          "$TARGET" \
          "$GITHUB_WORKSPACE/sdk-metadata"

    - name: Upload package build artifact
      uses: actions/upload-artifact@v4.6.2
      if: env.UPLOAD_PACKAGES_FOR_ARTIFACT == 'true'
      with:
        name: packages-${{ needs.plan.outputs.sdk_tag }}-${{ env.TARGET }}
        path: package-release
        if-no-files-found: error
        compression-level: 0

    - name: Report skipped package release
      if: env.CREATE_RELEASE == 'true' && env.UPLOAD_PACKAGES_FOR_RELEASE == 'true' && steps.private-feeds.outputs.enabled != 'true'
      run: echo "REPO_TOKEN is not configured; package artifacts are available but the GitHub Release is skipped."

    - name: Create package release body
      if: env.CREATE_RELEASE == 'true' && env.UPLOAD_PACKAGES_FOR_RELEASE == 'true' && steps.private-feeds.outputs.enabled == 'true'
      run: |
        {
          echo "Packages built with Kwrt SDK"
          echo
          echo "- SDK repository: $SDK_REPOSITORY"
          echo "- SDK release: $SDK_RELEASE_TAG"
          echo "- SDK asset: $SDK_ASSET_NAME"
          echo "- SDK SHA256: $SDK_SHA256"
          echo "- Package architecture: $TARGET"
          echo "- Private workspace: $PRIVATE_WORKSPACE_COMMIT"
        } > release.txt

    - name: Upload packages for release
      uses: softprops/action-gh-release@v2.6.2
      if: env.CREATE_RELEASE == 'true' && env.UPLOAD_PACKAGES_FOR_RELEASE == 'true' && steps.private-feeds.outputs.enabled == 'true'
      with:
        files: package-release/release-assets/*
        name: Packages for ${{ needs.plan.outputs.sdk_tag }}
        tag_name: packages-${{ needs.plan.outputs.sdk_tag }}
        body_path: release.txt
