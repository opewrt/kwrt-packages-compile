name: Repo Dispatcher

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'package architecture'
        required: true
        default: 'x86_64'
      sdk_tag:
        description: 'Kwrt release tag, empty selects the latest compatible release'
        required: false
        default: ''
      sdk_asset:
        description: 'exact SDK asset name, empty selects the release SDK'
        required: false
        default: ''
      main_commit:
        description: 'exact kwrt-main commit, empty uses main'
        required: false
        default: ''
      packages:
        description: 'managed package directory regex'
        required: false
        default: '.*'
      release:
        description: 'create package release'
        required: false
        type: boolean
        default: true
      nocache:
        description: 'disable build caches'
        required: false
        type: boolean
        default: false

env:
  TZ: Asia/Shanghai

jobs:
  dispatch:
    if: github.repository_owner == 'opewrt'
    runs-on: ubuntu-latest
    steps:
    - name: Trigger package build
      env:
        GH_TOKEN: ${{ secrets.REPO_TOKEN }}
        TARGET: ${{ inputs.target }}
        SDK_TAG: ${{ inputs.sdk_tag }}
        SDK_ASSET: ${{ inputs.sdk_asset }}
        MAIN_COMMIT: ${{ inputs.main_commit }}
        PACKAGES: ${{ inputs.packages }}
        CREATE_RELEASE: ${{ inputs.release }}
        NOCACHE: ${{ inputs.nocache }}
      run: |
        set -euo pipefail
        test -n "$GH_TOKEN"
        jq -n \
          --arg target "$TARGET" \
          --arg sdk_tag "$SDK_TAG" \
          --arg sdk_asset "$SDK_ASSET" \
          --arg main_commit "$MAIN_COMMIT" \
          --arg packages "$PACKAGES" \
          --argjson release "$CREATE_RELEASE" \
          --argjson nocache "$NOCACHE" \
          '{
            event_type: "packages-build",
            client_payload: {
              target: $target,
              sdk_repository: "opewrt/Kwrt",
              sdk_tag: $sdk_tag,
              sdk_asset: $sdk_asset,
              main_commit: $main_commit,
              packages: $packages,
              release: $release,
              nocache: $nocache
            }
          }' |
          gh api \
            --method POST \
            "repos/${{ github.repository }}/dispatches" \
            --input -
